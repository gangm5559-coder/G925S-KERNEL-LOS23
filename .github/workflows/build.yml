name: Build LOS23 Kernel zerolteskt G925S - No Git Clone v4

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout self
        uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android /usr/share/swift /opt/az
          df -h

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf libelf-dev libncurses5-dev libssl-dev python3 gcc-aarch64-linux-gnu device-tree-compiler cpio tar

      - name: Restore boot parts
        run: |
          if ls boot_part_* 1>/dev/null 2>&1; then cat boot_part_* > boot.img; echo "Merged boot.img"; ls -lh boot.img; fi

      - name: Download kernel tarball - NO git clone (Fix 128)
        run: |
          set +e
          rm -rf kernel.tar.gz kernel
          # Try multiple branches via tarball download - bypasses git error 128
          for branch in lineage-20.0 lineage-21.0 lineage-20 lineage-19.1 main master; do
            echo "Trying branch $branch from samsungexynos7420"
            curl -L -f --retry 3 https://github.com/samsungexynos7420/android_kernel_samsung_exynos7420/archive/refs/heads/$branch.tar.gz -o kernel.tar.gz
            if [ $? -eq 0 ] && [ -f kernel.tar.gz ]; then
              echo "Downloaded $branch"
              tar xzf kernel.tar.gz
              mv android_kernel_samsung_exynos7420-$branch kernel 2>/dev/null || mv android_kernel_samsung_exynos7420-* kernel 2>/dev/null || true
              if [ -d kernel ]; then
                echo "Success $branch"
                break
              fi
            fi
            rm -rf kernel.tar.gz kernel android_kernel*
          done
          # Fallback LineageOS repo
          if [ ! -d kernel ]; then
            for branch in lineage-20.0 lineage-21.0 lineage-20 main; do
              echo "Trying LineageOS branch $branch"
              curl -L -f --retry 3 https://github.com/LineageOS/android_kernel_samsung_exynos7420/archive/refs/heads/$branch.tar.gz -o kernel.tar.gz
              if [ $? -eq 0 ]; then
                tar xzf kernel.tar.gz
                mv android_kernel_samsung_exynos7420-$branch kernel 2>/dev/null || mv android_kernel* kernel 2>/dev/null || true
                if [ -d kernel ]; then break; fi
              fi
              rm -rf kernel.tar.gz kernel android_kernel*
            done
          fi
          set -e
          ls -lh kernel/ | head -20
          ls kernel/arch/arm64/configs/ | grep -E "7420|zerolte" | head -20

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make exynos7420-zerolteskt_defconfig || make exynos7420-zeroltexx_defconfig || make exynos7420-zeroflte_defconfig
          make -j$(nproc --all) Image dtbs || make -j4 Image
          mkdir -p ../out_kernel
          cp arch/arm64/boot/Image ../out_kernel/ 2>/dev/null || cp arch/arm/boot/zImage ../out_kernel/ 2>/dev/null || true
          find arch/arm64/boot/dts -name "*.dtb" -exec cp {} ../out_kernel/ \; 2>/dev/null || true
          ls -lh ../out_kernel/

      - name: Download magiskboot
        run: |
          curl -sL https://github.com/topjohnwu/Magisk/releases/download/v27.0/magisk-27.0.apk -o magisk.apk || true
          unzip -q magisk.apk lib/arm64-v8a/libmagiskboot.so -d magisk_tmp 2>/dev/null || true
          cp magisk_tmp/lib/arm64-v8a/libmagiskboot.so ./magiskboot 2>/dev/null || wget -q https://github.com/ooki/magiskboot_build/raw/master/magiskboot -O magiskboot || true
          chmod +x magiskboot || true

      - name: Repack
        run: |
          if [ -f boot.img ] && [ -f ./magiskboot ]; then
            ./magiskboot unpack boot.img || true
            cp out_kernel/Image kernel 2>/dev/null || cp out_kernel/zImage kernel 2>/dev/null || true
            ./magiskboot repack boot.img new-boot-lOS23-zerolteskt.img || true
            mkdir -p out_final
            cp new-boot*.img out_final/ 2>/dev/null || true
          else
            mkdir -p out_final
            cp -r out_kernel/* out_final/ || true
          fi
          ls -lh out_final/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-los23-zerolteskt-G925S
          path: out_final/
