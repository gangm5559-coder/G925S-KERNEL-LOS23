name: Build LOS23 Kernel zerolteskt G925S - Fix 128 v3

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout self (for boot parts)
        uses: actions/checkout@v4
        with:
          path: self

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android /usr/share/swift /opt/az
          df -h

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf libelf-dev libncurses5-dev libssl-dev python3 gcc-aarch64-linux-gnu device-tree-compiler cpio

      - name: Restore boot.img parts
        run: |
          cd self
          if ls boot_part_* 1>/dev/null 2>&1; then cat boot_part_* > boot.img; echo "Merged"; fi
          ls -lh *.img 2>/dev/null || true
          cp boot.img ../boot.img 2>/dev/null || true
          cd ..

      - name: Clone kernel via checkout action (bypass git clone 128)
        uses: actions/checkout@v4
        with:
          repository: samsungexynos7420/android_kernel_samsung_exynos7420
          path: kernel
          fetch-depth: 1

      - name: Fallback clone if first failed
        if: failure()
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_samsung_exynos7420
          path: kernel
          fetch-depth: 1

      - name: List configs
        run: |
          ls kernel/arch/arm64/configs/ | grep -E "7420|zerolte|zeroflte" || ls kernel/arch/arm64/configs/ | head -30
          cd kernel
          git branch -a | head -20

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make exynos7420-zerolteskt_defconfig || make exynos7420-zeroltexx_defconfig || make exynos7420-zeroflte_defconfig
          make -j$(nproc --all) Image dtbs || make -j4 Image
          mkdir -p ../out_kernel
          cp arch/arm64/boot/Image ../out_kernel/ 2>/dev/null || cp arch/arm/boot/zImage ../out_kernel/ 2>/dev/null || cp arch/arm64/boot/Image.gz ../out_kernel/ 2>/dev/null || true
          find arch/arm64/boot/dts -name "*.dtb" -exec cp {} ../out_kernel/ \; 2>/dev/null || true
          ls -lh ../out_kernel/

      - name: Download magiskboot
        run: |
          curl -sL https://github.com/topjohnwu/Magisk/releases/download/v27.0/magisk-27.0.apk -o magisk.apk || true
          unzip -q magisk.apk lib/arm64-v8a/libmagiskboot.so -d magisk_tmp 2>/dev/null || true
          cp magisk_tmp/lib/arm64-v8a/libmagiskboot.so ./magiskboot 2>/dev/null || wget -q https://github.com/ooki/magiskboot_build/raw/master/magiskboot -O magiskboot || true
          chmod +x magiskboot || true

      - name: Repack boot.img
        run: |
          BOOT_IMG="boot.img"
          if [ ! -f "$BOOT_IMG" ]; then BOOT_IMG="self/boot.img"; fi
          echo "BOOT_IMG=$BOOT_IMG"
          if [ -f "$BOOT_IMG" ] && [ -f "./magiskboot" ]; then
            ./magiskboot unpack "$BOOT_IMG" || true
            cp out_kernel/Image kernel 2>/dev/null || cp out_kernel/zImage kernel 2>/dev/null || cp out_kernel/Image.gz kernel 2>/dev/null || true
            ls -lh kernel ramdisk.cpio* 2>/dev/null || true
            ./magiskboot repack "$BOOT_IMG" new-boot-lOS23-zerolteskt.img || true
            mkdir -p out_final
            cp new-boot*.img out_final/ 2>/dev/null || true
          else
            mkdir -p out_final
            cp -r out_kernel/* out_final/ || true
          fi
          ls -lh out_final/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-los23-zerolteskt-G925S
          path: out_final/
